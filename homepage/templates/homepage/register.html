{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <style>
      body {
        background: linear-gradient(135deg, #93c4dc, #eef7f1);
        font-family: Arial, sans-serif;
      }
      .auth-container {
        width: 400px;
        margin: 80px auto;
        padding: 30px;
        border-radius: 12px;
        background-color: #ffffff;
        box-shadow: 0 6px 16px rgba(0,0,0,0.15);
        animation: fadeIn 0.6s ease-in-out;
      }
      .auth-container h2 {
        text-align: center;
        color: #006699;
        margin-bottom: 25px;
      }
      .auth-container form {
        display: flex;
        flex-direction: column;
      }
      .auth-container label {
        margin-top: 12px;
        font-weight: bold;
        color: #333;
      }
      .auth-container input {
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        margin-top: 6px;
        transition: border-color 0.3s;
      }
      .auth-container input:focus {
        border-color: #006699;
        outline: none;
      }
      .auth-container button {
        margin-top: 20px;
        padding: 12px;
        border-radius: 6px;
        background-color: #006699;
        color: #fff;
        border: none;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.3s;
      }
      .auth-container button:hover {
        background-color: #004466;
      }
      .auth-container p {
        text-align: center;
        margin-top: 15px;
      }
      .auth-container a {
        color: #006699;
        text-decoration: none;
      }
      .auth-container a:hover {
        text-decoration: underline;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2>Đăng ký tài khoản</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button id="register_button" type="submit">Đăng ký</button>
        </form>
        <p>Đã có tài khoản? <a href="{% url 'login' %}">Đăng nhập</a></p>
    </div>
</body>
</html>
